# ---------------------------------------------------------------------------
# Pipeline configuration
# ---------------------------------------------------------------------------

# Sample sheet: sample name -> paired FASTQ paths (generated by
# scripts/generate_test_data.py; not committed to the repo, see .gitignore)
samples:
  demo:
    r1: "data/reads/demo_R1.fastq.gz"
    r2: "data/reads/demo_R2.fastq.gz"

reference: "data/reference/ref.fasta"

# Synthetic test-data parameters (used by the generate_test_data rule)
sim:
  seed: 42
  ref_length: 5000
  coverage: 30
  read_length: 150
  error_rate: 0.001

threads: 2

# Variant caller backend for the *default* CI-friendly path.
# "bcftools" = fast, minimal deps, runs in CI.
# GATK best-practices rules (HaplotypeCaller/GenotypeGVCFs/hard-filter) are
# always available as explicit targets — see workflow/rules/call.smk and
# README "Two calling paths" section.
caller: "bcftools"

# Lightweight bcftools filtering thresholds
bcftools_min_qual: 20
bcftools_min_depth: 8

# GATK hard-filter thresholds (SNP), per GATK Best Practices germline
# short-variant discovery recommendations
gatk_snp_filters:
  QD: 2.0
  FS: 60.0
  MQ: 40.0
  MQRankSum: -12.5
  ReadPosRankSum: -8.0
  SOR: 3.0

# Optional annotation (opt-in, not part of default `rule all` — see
# workflow/rules/annotate.smk)
snpeff_genome: "GRCh38.99"
